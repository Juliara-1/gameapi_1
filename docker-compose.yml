
version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    restart: always
    depends_on:
      - db
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - KAFKA_BROKER=host.docker.internal:9092
      - REDIS_HOST=redis 
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - .:/game_service
    networks:
      - shared_network

  db:
    image: postgres:15
    container_name: postgres_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true

volumes:
  postgres_data: